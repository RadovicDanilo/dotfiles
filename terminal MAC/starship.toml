# ==========================================================================
# 1. CORE LAYOUT & STRUCTURE
# ==========================================================================
add_newline = true
scan_timeout = 20
command_timeout = 1000

# Keep the first line for location and source control. The second line carries
# only the tools detected in the current project.
format = """
$directory\
$git_branch\
$git_status\
$line_break\
$python\
$nodejs\
$azure\
$gcloud\
$terraform\
$kubernetes\
$docker_context\
$cmd_duration\
$character"""

# ==========================================================================
# 2. PATH & DIRECTORY DISPLAY (Legible & Crisp)
# ==========================================================================
[directory]
format = "[$path]($style) "
style = "bold fg:#d8a657"
truncation_length = 3
truncate_to_repo = true
home_symbol = "~"

# ==========================================================================
# 3. GIT VERSION CONTROL
# ==========================================================================
[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold fg:#e78a4e"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold fg:#ea6962"
conflicted = "="
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# ==========================================================================
# 4. RUNTIME ENVS (Displays ONLY when working in relevant codebase)
# ==========================================================================
[python]
symbol = " "
format = "via [$symbol$version]($style) "
style = "bold fg:#a9b665"

[nodejs]
symbol = " "
format = "via [$symbol($version)]($style) "
style = "bold fg:#7daea3"

# ==========================================================================
# 5. CLOUD & DEVOPS CONTEXT
# ==========================================================================
[azure]
symbol = "󰠅 "
format = "on [$symbol($subscription)]($style) "
style = "bold fg:#6cb6ff"

[gcloud]
symbol = "󱇶 "
format = "on [$symbol$account(@$domain)]($style) "
style = "bold fg:#8ec07c"

[terraform]
symbol = "󱁢 "
format = "via [$symbol$workspace]($style) "
style = "bold fg:#b8bb26"

[kubernetes]
symbol = "☸️  "
format = "in [$symbol($context)]($style) "
style = "bold fg:#8ec07c"
disabled = false

[docker_context]
symbol = "🐳 "
format = "via [$symbol($context)]($style) "
style = "bold fg:#7daea3"

# ==========================================================================
# 6. TIMING & INTERACTIVE CHARACTER INDICATORS
# ==========================================================================
[cmd_duration]
min_time = 2000
format = "took [$duration](bold fg:#d8a657) "

[character]
success_symbol = "[❯](bold fg:#a9b665) "
error_symbol = "[❯](bold fg:#ea6962) "
vicmd_symbol = "[VIM](bold fg:#e78a4e) "
